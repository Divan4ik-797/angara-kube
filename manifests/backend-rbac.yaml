apiVersion: v1
kind: ServiceAccount
metadata:
  name: backend-sa
  namespace: homework
  labels:
    app.kubernetes.io/name: backend
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: backend-role
  namespace: homework
  labels:
    app.kubernetes.io/name: backend
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: backend-rolebinding
  namespace: homework
  labels:
    app.kubernetes.io/name: backend
subjects:
  - kind: ServiceAccount
    name: backend-sa
    namespace: homework
roleRef:
  kind: Role
  name: backend-role
  apiGroup: rbac.authorization.k8s.io
